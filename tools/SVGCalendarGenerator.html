:root {
    /* Aligned exactly to index.html and Panel Editor */
    --bg-main-light: #f8f9fa;
    --bg-secondary-light: #f8f9fa;
    --bg-panel-light: #ffffff;
    --text-primary-light: #111111;
    --text-secondary-light: #555555;
    --border-color-light: #e5e7eb;
    
    --bg-main-dark: #111111;
    --bg-secondary-dark: #1a1a1a;
    --bg-panel-dark: #222222;
    --text-primary-dark: #ffffff;
    --text-secondary-dark: #cccccc;
    --border-color-dark: #333333;

    --sidebar-width: 320px;
}

body.light-mode {
    --bg-main: var(--bg-main-light);
    --bg-secondary: var(--bg-secondary-light);
    --bg-panel: var(--bg-panel-light);
    --text-primary: var(--text-primary-light);
    --text-secondary: var(--text-secondary-light);
    --border-color: var(--border-color-light);
}

body.dark-mode {
    --bg-main: var(--bg-main-dark);
    --bg-secondary: var(--bg-secondary-dark);
    --bg-panel: var(--bg-panel-dark);
    --text-primary: var(--text-primary-dark);
    --text-secondary: var(--text-secondary-dark);
    --border-color: var(--border-color-dark);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: rgba(128, 128, 128, 0.3);
    border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgba(128, 128, 128, 0.5);
}

body {
    font-family: 'Outfit', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    transition: background-color 0.3s, color 0.3s;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
}

/* Tool Header & Back Button */
.tool-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}
.tool-title-area {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}
.tool-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.back-home-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
}
/* Light Mode Back Button */
body.light-mode .back-home-btn {
    color: #111111;
    background-color: #f8f9fa;
    border: 1px solid #d1d5db;
}
body.light-mode .back-home-btn:hover {

}
/* Dark Mode Back Button */
body.dark-mode .back-home-btn {
    color: #efeff1;
    background-color: #18181b;

}
body.dark-mode .back-home-btn:hover {

}
.tool-name-heading {

.tool-description-sub {

}
.tool-safety-note {

<script>
    const THEME_KEY = 'svg_calendar_generator_theme_v2';

    // Theme Switch logic copied from Panel Editor
    function updateThemeUI(theme) {
        localStorage.setItem(THEME_KEY, theme);
        
        const iconEl = document.getElementById('header-theme-icon');
        const textEl = document.getElementById('header-theme-text');
        
        if (theme === 'dark') {
            document.body.className = 'dark-mode';
            if (iconEl) iconEl.className = 'fa-solid fa-moon';
            if (textEl) textEl.textContent = 'ダークモード';
        } else {
            document.body.className = 'light-mode';
            if (iconEl) iconEl.className = 'fa-solid fa-sun';
            if (textEl) textEl.textContent = 'ライトモード';
        }
    }

    window.onload = function() {
        // Init theme
        const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
        updateThemeUI(savedTheme);

        // Bind theme click
        const headerThemeToggle = document.getElementById('header-theme-toggle');
        if (headerThemeToggle) {
            headerThemeToggle.addEventListener('click', () => {
                const currentTheme = localStorage.getItem(THEME_KEY) || 'light';
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                updateThemeUI(newTheme);
            });
        }

        const today = new Date();
        const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
        document.getElementById('year').value = nextMonth.getFullYear();
        document.getElementById('month').value = nextMonth.getMonth() + 1;
        
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('input', updatePreview);
        });
        updatePreview();
    };

    function createLineSVG(x1, y1, x2, y2, style, strokeWidth) {
        if (style === 'wavy') {
            const isHoriz = Math.abs(y1 - y2) < 0.1;
            const len = isHoriz ? Math.abs(x2 - x1) : Math.abs(y2 - y1);
            const waveLen = 12;
            const amp = strokeWidth * 2; 
            let d = `M ${x1} ${y1}`;
            let current = 0;
            let sign = 1;
            while(current < len) {
                let step = Math.min(waveLen, len - current);
                if (isHoriz) d += ` q ${step/2} ${amp * sign}, ${step} 0`;
                else d += ` q ${amp * sign} ${step/2}, 0 ${step}`;
                current += step;
                sign *= -1;
            }
            return `    <path d="${d}" fill="none" />\n`;
        } else {
            let dash = "";
            let cap = "";
            if (style === 'dashed') dash = `stroke-dasharray="${strokeWidth * 4} ${strokeWidth * 3}" `;
            if (style === 'dotted') {
                dash = `stroke-dasharray="0 ${strokeWidth * 2.5}" `;
                cap = `stroke-linecap="round" `;
            }
            return `    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${dash}${cap}/>\n`;
        }
    }

    function generateSVGString() {
        const year = parseInt(document.getElementById('year').value, 10);
        const month = parseInt(document.getElementById('month').value, 10) - 1;
        const startDayOffset = parseInt(document.getElementById('startDay').value, 10);
        const layoutType = document.getElementById('layoutType').value;
        const showGrid = document.getElementById('showGrid').checked;
        
        const width = parseFloat(document.getElementById('docWidth').value) || 1000;
        const height = parseFloat(document.getElementById('docHeight').value) || 1000;
        const headerHeight = parseFloat(document.getElementById('headerHeight').value) || 0;
        
        const fontSize = parseFloat(document.getElementById('fontSize').value) || 15;
        const padLeft = parseFloat(document.getElementById('padLeft').value) || 20;
        const padTop = parseFloat(document.getElementById('padTop').value) || 30;

        const lineStyle = document.getElementById('lineStyle').value;
        const strokeWidth = parseFloat(document.getElementById('lineWidth').value) || 2;
        const lineColor = document.getElementById('lineColor').value;
        const lineOpacity = document.getElementById('lineOpacity').value;
        
        const textColor = document.getElementById('textColor').value;
        const textOpacity = document.getElementById('textOpacity').value;

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const numDays = lastDay.getDate();
        
        const dayNames = startDayOffset === 1 
            ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] 
            : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        let svg = `<svg id="svg-preview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">\n`;
        svg += `  <rect width="100%" height="100%" fill="white" />\n`;

        let textAttrs = `font-family="sans-serif" font-size="${fontSize}px" fill="${textColor}" opacity="${textOpacity}"`;

        if (layoutType === 'grid') {
            const gridHeight = height - headerHeight;
            const cols = 7;
            const rows = 6;
            const cellWidth = width / cols;
            const cellHeight = gridHeight / rows;

            if (showGrid) {
                svg += `  <g id="grid-lines" stroke="${lineColor}" stroke-width="${strokeWidth}" stroke-opacity="${lineOpacity}">\n`;
                for (let i = 0; i <= cols; i++) {
                    let x = i * cellWidth;
                    if (i === cols && lineStyle !== 'wavy') x -= strokeWidth / 2;
                    else if (i === 0 && lineStyle !== 'wavy') x += strokeWidth / 2;
                    svg += createLineSVG(x, headerHeight, x, height, lineStyle, strokeWidth);
                }
                for (let j = 0; j <= rows; j++) {
                    let y = headerHeight + j * cellHeight;
                    if (j === rows && lineStyle !== 'wavy') y -= strokeWidth / 2;
                    else if (j === 0 && lineStyle !== 'wavy') y += strokeWidth / 2;
                    svg += createLineSVG(0, y, width, y, lineStyle, strokeWidth);
                }
                svg += `  </g>\n`;
            }

            svg += `  <g id="day-headers">\n`;
            for (let d = 0; d < 7; d++) {
                let textX = d * cellWidth + (cellWidth / 2);
                let textY = headerHeight / 2 + (fontSize / 3); 
                svg += `    <text x="${textX}" y="${textY}" ${textAttrs} text-anchor="middle">${dayNames[d]}</text>\n`;
            }
            svg += `  </g>\n`;

            svg += `  <g id="dates">\n`;
            let startDay = firstDay.getDay(); 
            let startCol = startDay - startDayOffset;
            if (startCol < 0) startCol += 7;
            
            let currentCol = startCol;
            let currentRow = 0;
            
            for (let day = 1; day <= numDays; day++) {
                let tx = currentCol * cellWidth + padLeft; 
                let ty = headerHeight + currentRow * cellHeight + padTop; 
                svg += `    <text x="${tx}" y="${ty}" ${textAttrs} text-anchor="start">${day}</text>\n`;
                currentCol++;
                if (currentCol > 6) {
                    currentCol = 0;
                    currentRow++;
                }
            }
            svg += `  </g>\n`;

        } else if (layoutType === 'vertical') {
            const listHeight = height - headerHeight;
            const rowHeight = listHeight / numDays;
            
            if (headerHeight > 0) {
                svg += `  <g id="header">\n`;
                let headerY = headerHeight / 2 + (fontSize / 3);
                svg += `    <text x="${padLeft}" y="${headerY}" ${textAttrs} text-anchor="start">${year} / ${month + 1}</text>\n`;
                svg += `  </g>\n`;
            }

            if (showGrid) {
                svg += `  <g id="grid-lines" stroke="${lineColor}" stroke-width="${strokeWidth}" stroke-opacity="${lineOpacity}">\n`;
                svg += createLineSVG(strokeWidth/2, headerHeight, strokeWidth/2, height, lineStyle, strokeWidth);
                svg += createLineSVG(width - strokeWidth/2, headerHeight, width - strokeWidth/2, height, lineStyle, strokeWidth);
                for (let i = 0; i <= numDays; i++) {
                    let y = headerHeight + i * rowHeight;
                    if (i === numDays && lineStyle !== 'wavy') y -= strokeWidth / 2;
                    else if (i === 0 && lineStyle !== 'wavy') y += strokeWidth / 2;
                    svg += createLineSVG(0, y, width, y, lineStyle, strokeWidth);
                }
                svg += `  </g>\n`;
            }

            svg += `  <g id="dates">\n`;
            for (let day = 1; day <= numDays; day++) {
                let currentDate = new Date(year, month, day);
                let dayOfWeek = currentDate.getDay();
                let nameIndex = dayOfWeek - startDayOffset;
                if (nameIndex < 0) nameIndex += 7;
                let dayStr = dayNames[nameIndex];

                let tx = padLeft; 
                let ty = headerHeight + (day - 1) * rowHeight + padTop;
                
                svg += `    <text x="${tx}" y="${ty}" ${textAttrs} text-anchor="start">${day}</text>\n`;
                svg += `    <text x="${tx + fontSize * 2.5}" y="${ty}" font-family="sans-serif" font-size="${fontSize}px" fill="${textColor}" opacity="${textOpacity * 0.7}" text-anchor="start">${dayStr}</text>\n`;
            }
            svg += `  </g>\n`;
        }

        svg += `</svg>`;
        return svg;
    }

    function updatePreview() {
        const wrap = document.getElementById('svg-preview-wrap');
        wrap.innerHTML = generateSVGString();
    }

    function downloadSVG() {
        const year = parseInt(document.getElementById('year').value, 10);
        const month = parseInt(document.getElementById('month').value, 10) - 1;
        
        if (isNaN(year) || isNaN(month) || month < 0 || month > 11) {
            alert("正しい年月を入力してください。");
            return;
        }

        const svgContent = generateSVGString();
        const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Calendar_${year}_${month + 1}.svg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>
<script src="footer.js"></script>
</body>
