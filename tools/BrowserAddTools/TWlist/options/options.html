<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWlist - 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <div>
          <h1>TWlist 設定</h1>
          <p class="subtitle">Twitch配信通知の動作とチャンネル管理</p>
        </div>
      </div>
    </header>

    <main class="content">
      <!-- General Settings -->
      <section class="card">
        <h2>🔔 通知・監視設定</h2>
        


        <div class="form-group">
          <label for="checkInterval">チェック間隔</label>
          <select id="checkInterval" class="form-select">
            <option value="1">1分ごと（推奨）</option>
            <option value="2">2分ごと</option>
            <option value="3">3分ごと</option>
            <option value="5">5分ごと</option>
            <option value="10">10分ごと</option>
          </select>
          <p class="field-hint">配信者の開始を検知する定期バックグラウンド間隔です。</p>
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="notifyOnLive" checked>
            <span>配信開始時にデスクトップ通知を表示する</span>
          </label>
        </div>
      </section>



      <!-- Backup / Restore -->
      <section class="card">
        <h2>💾 登録チャンネルのバックアップ・復元</h2>
        <div class="btn-row">
          <button type="button" id="exportBtn" class="btn btn-secondary">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            登録リストを保存 (JSON)
          </button>
          <label class="btn btn-secondary file-upload-btn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            リストを復元 (JSON)
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
          </label>
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label for="bulkInput">一括テキスト登録（URLまたはユーザー名を1行に1つ）</label>
          <textarea id="bulkInput" class="form-textarea" rows="3" placeholder="https://www.twitch.tv/channel1&#10;channel2&#10;https://player.twitch.tv/?channel=channel3"></textarea>
          <button type="button" id="bulkAddBtn" class="btn btn-secondary" style="margin-top: 6px;">テキストから一括追加</button>
          <span id="bulkAddResult" class="test-result"></span>
        </div>
      </section>

      <!-- Save Bar -->
      <div class="save-bar">
        <button type="button" id="saveBtn" class="btn btn-primary">設定を保存する</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
    </main>
  </div>

  <script src="../common/twitch-api.js"></script>
  <script src="options.js"></script>
</body>
</html>
