<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpineWebOtameshi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#1a1a1a}
#spine-container{width:90vw;height:90vh;max-width:1200px;max-height:900px}
</style>

<script src="https://unpkg.com/@esotericsoftware/spine-webcomponents@4.3.*/dist/iife/spine-webcomponents.js"></script>
<script>
function run() {
    console.log("1. データ処理開始");
    
    // Spine Player用のデータをWeb Components用に変換
    var rawData = {};
    for (var key in rawDataURIs) {
        rawData[key] = rawDataURIs[key].split(',')[1] || rawDataURIs[key];
    }
    console.log("読み込んだファイル群:", Object.keys(rawData));

    var skeleton = document.createElement('spine-skeleton');

    // ★重要1： データを「一番最初」にセットする（コンポーネントが即座に読み込みを始めるため）
    skeleton.setAttribute('raw-data', JSON.stringify(rawData));

    // ★重要2： データ群の中から .skel と .atlas の名前を「自動で探して」セットする
    var skelName = Object.keys(rawData).find(k => k.endsWith('.skel') || k.endsWith('.json'));
    var atlasName = Object.keys(rawData).find(k => k.endsWith('.atlas'));

    if (skelName && atlasName) {
        skeleton.setAttribute('atlas', atlasName);
        skeleton.setAttribute('skeleton', skelName);
        console.log("データをセットしました: ", skelName, atlasName);
    } else {
        alert("エラー：データ内に .skel か .atlas が見つかりませんでした。");
    }

    // ★重要3： 存在確認のため「デバッグ用の線」を表示する
    skeleton.setAttribute('debug', ''); 
    skeleton.setAttribute('drag', '');

    skeleton.style.width = "100%";
    skeleton.style.height = "100%";

    var container = document.getElementById('spine-container');
    container.innerHTML = '';
    container.appendChild(skeleton);
    
    console.log("2. 画面の更新完了");
}

// ページが完全に読み込まれたら、確実に run() を起動させる
window.onload = run;
</script>
</head>
